  Companion redirect page for the MDA direct-fetch fallback (7.3b).

  equivalent) and add the same URL to App B SPA's Authentication redirect
  URIs.

  window.location, which clobbers MSAL's iframe checks. Hosting MSAL on a
  same-origin blank page avoids that. Pattern documented by Honza Hájek
  (hajekj.net, 2025-04-28).
-->
