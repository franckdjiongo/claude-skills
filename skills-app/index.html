<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />

    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Skills" />

    <!-- SEO -->
    <title>Claude Skills Library</title>
    <meta name="description" content="A curated collection of specialized skills, prompts, and tools to extend Claude Code's capabilities for specific domains and workflows." />
    <meta name="keywords" content="Claude, AI, Skills, Prompt Engineering, Tools, Library, Developer" />
    <meta name="author" content="Claude Skills Team" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://skills.claude.ai/" />
    <meta property="og:title" content="Claude Skills Library" />
    <meta property="og:description" content="Transform Claude Code into a domain expert with specialized skills and workflows." />
    <meta property="og:image" content="/logo.svg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:url" content="https://skills.claude.ai/" />
    <meta property="twitter:title" content="Claude Skills Library" />
    <meta property="twitter:description" content="Transform Claude Code into a domain expert with specialized skills and workflows." />
    <meta property="twitter:image" content="/logo.svg" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Claude Skills Library",
        "url": "https://skills.claude.ai/",
        "description": "A curated collection of specialized skills for Claude Code.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
