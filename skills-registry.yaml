# Skills Registry - Multi-Repository Skills Index
# This file catalogs skills across multiple repositories for easy discovery.
# Use `python scripts/registry-manager.py` to manage and search the registry.

version: "1.0"
last_updated: "2026-01-18"

# =============================================================================
# REPOSITORIES
# =============================================================================
# Define all repositories containing skills. Local repos have a local_path,
# external repos only have a URL for reference.

repositories:
  claude-skills:
    url: https://github.com/franckdjiongo/claude-skills
    local_path: "."
    description: Main skills library - Power Platform, Claude Code, text processing, and more
    is_local: true

  superpowers:
    url: https://github.com/obra/superpowers
    local_path: null
    description: Composable skills for coding agents - TDD, debugging, collaboration
    is_local: false
    skills_path: skills/  # Path prefix for skills in this repo

  anthropic-skills:
    url: https://github.com/anthropics/skills
    local_path: null
    description: Official Anthropic skills - documents, creative design, MCP, and enterprise workflows
    is_local: false
