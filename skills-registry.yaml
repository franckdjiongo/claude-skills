# Skills Registry - Multi-Repository Skills Index
# This file catalogs skills across multiple repositories for easy discovery.
# Use `python scripts/registry-manager.py` to manage and search the registry.

version: "1.0"
last_updated: "2026-07-07"

# =============================================================================
# REPOSITORIES
# =============================================================================
# Define all repositories containing skills. Local repos have a local_path,
# external repos only have a URL for reference.

repositories:
  claude-skills:
    url: https://github.com/franckdjiongo/claude-skills
    local_path: "."
    description: Main skills library - Power Platform, Claude Code, text processing, and more
    is_local: true

  superpowers:
    url: https://github.com/obra/superpowers
    local_path: null
    description: Composable skills for coding agents - TDD, debugging, collaboration
    is_local: false
    skills_path: skills/  # Path prefix for skills in this repo

  anthropic-skills:
    url: https://github.com/anthropics/skills
    local_path: null
    description: Official Anthropic skills - documents, creative design, MCP, and enterprise workflows
    is_local: false
    skills_path: skills/  # Path prefix for skills in this repo

  antigravity-kit:
    url: https://github.com/vudovn/antigravity-kit
    local_path: null
    description: Modular AI agent skills - 40 skills covering frontend, backend, testing, security, and architecture
    is_local: false
    skills_path: .agent/skills/  # Path prefix for skills in this repo

  resend-email:
    url: https://github.com/resend
    local_path: null
    description: Email skills for AI agents - best practices, React Email templates, and Resend API integration
    is_local: false
    skills_path: ""  # Skills are in separate repos under resend org

  dk-power-platform:
    url: https://github.com/DanielKerridge/claude-code-power-platform-skills
    local_path: null
    description: Power Platform skills for Claude Code - plan, build, deploy, and test Power Apps, Dataverse, plugins, PCF controls
    is_local: false
    skills_path: ""  # Skills are at root level

  ms-power-platform:
    url: https://github.com/microsoft/power-platform-skills
    local_path: null
    description: Official Microsoft Power Platform skills - Power Pages, Model Apps, and Power Apps plugins for Claude Code and GitHub Copilot
    is_local: false
    skills_path: plugins/  # Skills are under plugins/{plugin}/skills/

  korchard-power-platform:
    url: https://github.com/korchard333/claude-power-platform-community
    local_path: null
    description: Community Power Platform skills for Claude Code - agent personas, code apps, Dataverse, security, ALM, AI Builder, and 40 domain skills
    is_local: false
    skills_path: .claude/skills/  # Skills are under .claude/skills/{skill}/

